[workspace]
members = ["rqget", "rqget-core", "rqget-test"]
default-members = ["rqget"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
rqget-core = { path = "rqget-core", version = "0.1.0" }
rqget-test = { path = "rqget-test", version = "0.1.0" }
anyhow = "1"
camino = { version = "1.2", features = ["serde1"] }
camino-tempfile = "1.4"
clap = { version = "4", features = ["derive"] }
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "signal"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Internal unpublished crates have no distribution metadata or chosen license yet.
cargo_common_metadata = "allow"
# The engine controls its transitive graph, which legitimately contains version duplicates.
multiple_crate_versions = "allow"
# Inferred struct-update defaults are the workspace convention.
default_trait_access = "allow"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
map_err_ignore = "warn"
undocumented_unsafe_blocks = "warn"
