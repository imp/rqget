[package]
name = "rqget"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"


[dependencies]
anyhow = "1"
camino = { version = "1.2", features = ["serde1"] }
camino-tempfile = "1.4"
clap = { version = "4", features = ["derive"] }
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "signal"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"
